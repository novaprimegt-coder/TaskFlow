<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TaskFlow</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050914;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{min-height:100dvh;display:grid;place-items:center;padding:24px;overflow:hidden;background:
radial-gradient(circle at 50% 28%,rgba(66,225,209,.10),transparent 34%),
linear-gradient(180deg,#050914 0%,#07101e 58%,#050914 100%)}
.card{width:min(440px,100%);text-align:center}
.logo{font-size:44px;line-height:1;font-weight:950;letter-spacing:-.04em;background:linear-gradient(90deg,#42e1d1,#67e5d6,#ff9a43);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 34px rgba(66,225,209,.10)}
.sub{margin-top:10px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#8291aa;font-weight:850}
.msg{margin-top:20px;color:#aab5c8;font-size:13px}
.bar{height:5px;border-radius:999px;background:#10192b;overflow:hidden;margin:22px auto 0;max-width:310px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#40dfd0,#62e4b0,#ff9a43);animation:tfBoot5 5s linear forwards;border-radius:999px}
@keyframes tfBoot5{from{width:0}to{width:100%}}
.nv-watermark{margin:30px auto 0;display:grid;justify-items:center;gap:8px;opacity:.44;max-width:280px}
.nv-watermark img{display:block;width:min(220px,68vw);height:auto;border-radius:10px;filter:saturate(.82) brightness(.86);opacity:.48}
.nv-watermark span{font-size:9px;letter-spacing:.08em;color:#8290a8;text-transform:uppercase;font-weight:750}
.err{margin-top:14px;color:#ff8b9a;font-size:11px;display:none;line-height:1.45}
.retry{display:none;margin:16px auto 0;border:1px solid rgba(75,226,212,.3);border-radius:12px;padding:10px 16px;background:#12323a;color:#55e1d3;font-weight:800}
</style>
</head>
<body>
<div class="boot">
  <div class="card">
    <div class="logo">TaskFlow</div>
    <div class="sub">Organiza · Avanza · Cumple</div>
    <div class="msg" id="m">Preparando tu sistema…</div>
    <div class="bar" id="b"><i></i></div>
    <div class="nv-watermark" aria-label="Creado y actualizado por NovaVision GT">
      <img src="./novavision-watermark.svg" alt="NovaVision GT">
      <span>Creado y actualizado por NovaVision GT</span>
    </div>
    <div class="err" id="e"></div>
    <button class="retry" id="r" type="button">Reintentar</button>
  </div>
</div>
<script>
(()=>{
'use strict';
const msg=document.getElementById('m'),err=document.getElementById('e'),bar=document.getElementById('b'),retry=document.getElementById('r');
const MIN_BOOT_MS=5000;
let timer=null;
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function resetBar(){
  const i=bar&&bar.querySelector('i');
  if(!i)return;
  i.style.animation='none';
  void i.offsetWidth;
  i.style.animation='tfBoot5 5s linear forwards';
}
function fail(ex){
  if(timer){clearTimeout(timer);timer=null;}
  console.error('TaskFlow boot:',ex);
  bar.style.display='none';
  msg.textContent='No se pudo iniciar TaskFlow.';
  err.textContent=ex&&ex.name==='AbortError'?'La carga tardó demasiado. Toca Reintentar.':String(ex&&ex.message?ex.message:ex);
  err.style.display='block';
  retry.style.display='inline-flex';
}
async function start(){
  const started=performance.now();
  err.style.display='none';retry.style.display='none';bar.style.display='block';msg.textContent='Cargando TaskFlow…';resetBar();
  const ctrl=new AbortController();
  timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch('./taskflow-loader-v102.html?v=13031-20261001',{cache:'default',signal:ctrl.signal});
    if(!res.ok)throw new Error('No se pudo cargar la base de TaskFlow ('+res.status+')');
    let html=await res.text();
    if(timer){clearTimeout(timer);timer=null;}

    const loaderVisualStyle=`<style id="tf-loader-visual-restore">
html,body{margin:0!important;min-height:100%!important;background:#050914!important;color:#fff!important;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
.boot{min-height:100dvh!important;display:grid!important;place-items:center!important;padding:24px!important;overflow:hidden!important;background:radial-gradient(circle at 50% 28%,rgba(66,225,209,.10),transparent 34%),linear-gradient(180deg,#050914 0%,#07101e 58%,#050914 100%)!important}
.card{width:min(440px,100%)!important;text-align:center!important}
.logo{font-size:44px!important;line-height:1!important;font-weight:950!important;letter-spacing:-.04em!important;background:linear-gradient(90deg,#42e1d1,#67e5d6,#ff9a43)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;-webkit-text-fill-color:transparent!important;text-shadow:0 0 34px rgba(66,225,209,.10)!important}
.sub{margin-top:10px!important;font-size:10px!important;letter-spacing:.17em!important;text-transform:uppercase!important;color:#8291aa!important;font-weight:850!important}
.msg{margin-top:20px!important;color:#aab5c8!important;font-size:13px!important;line-height:normal!important}
.bar{height:5px!important;border-radius:999px!important;background:#10192b!important;overflow:hidden!important;margin:22px auto 0!important;max-width:310px!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)!important}
.bar>i{display:block!important;height:100%!important;width:0!important;background:linear-gradient(90deg,#40dfd0,#62e4b0,#ff9a43)!important;animation:tfBoot5 5s linear forwards!important;border-radius:999px!important;transform:none!important}
@keyframes tfBoot5{from{width:0}to{width:100%}}
.nv-watermark{margin:30px auto 0!important;display:grid!important;justify-items:center!important;gap:8px!important;opacity:.44!important;max-width:280px!important}
.nv-watermark img{display:block!important;width:min(220px,68vw)!important;height:auto!important;border-radius:10px!important;filter:saturate(.82) brightness(.86)!important;opacity:.48!important}
.nv-watermark span{font-size:9px!important;letter-spacing:.08em!important;color:#8290a8!important;text-transform:uppercase!important;font-weight:750!important}
.retry{display:none;margin:16px auto 0!important;border:1px solid rgba(75,226,212,.3)!important;border-radius:12px!important;padding:10px 16px!important;background:#12323a!important;color:#55e1d3!important;font-weight:800!important}
.error .bar{display:none!important}.error .retry{display:inline-flex!important}
.detail{display:none!important;margin:12px auto 0!important;max-width:370px!important;color:#75849d!important;font-size:10px!important;line-height:1.45!important;word-break:break-word!important}.error .detail{display:block!important}
</style>`;
    const loaderScreen=`<div class="boot" id="boot"><div class="card">
  <div class="logo">TaskFlow</div>
  <div class="sub">Organiza · Avanza · Cumple</div>
  <div class="msg" id="msg">Preparando tu sistema…</div>
  <div class="bar"><i></i></div>
  <div class="nv-watermark" aria-label="Creado y actualizado por NovaVision GT">
    <img src="./novavision-watermark.svg" alt="NovaVision GT">
    <span>Creado y actualizado por NovaVision GT</span>
  </div>
  <button class="retry" id="retry" type="button">Reintentar</button>
  <div class="detail" id="detail"></div>
</div></div>`;
    html=html.replace('</head>',loaderVisualStyle+'</head>');
    html=html.replace(/<div class="boot" id="boot"><div class="card">[\s\S]*?<\/div><\/div>\s*<script>/,loaderScreen+'<script>');

    const headNeedle="if(html.includes('</head>'))html=html.replace('</head>',injectedStyle+cleanupScript+scrollBridgeScript+iconPortalGuard+'</head>');";
    const headFix="if(html.includes('</head>'))html=html.replace('</head>',injectedStyle+cleanupScript+'<script src=\"./taskflow-touch-v105.js?v=1240-20260926\"><\\/script>'+scrollBridgeScript+iconPortalGuard+'<link rel=\"stylesheet\" href=\"./taskflow-503020.css?v=1110-20260909\"><link rel=\"stylesheet\" href=\"./taskflow-profile-v108.css?v=1110-20260909\"><style id=\"tf-v1192-main-spacing\">.wrap{padding-bottom:max(20px,env(safe-area-inset-bottom))!important}.v48-discipline-center{margin-bottom:0!important}</style>'+'</head>');";
    const payloadCacheNeedle="fetch(base+name,{cache:'no-store',mode:'cors'})";
    const payloadCacheFix="fetch(base+name,{cache:'force-cache',mode:'cors'})";
    const perfGuard='<script id="tf-v123-performance-guard">(function(){if(window.__tfV123PerformanceGuard)return;window.__tfV123PerformanceGuard=true;var Native=window.MutationObserver;if(!Native)return;function Quiet(cb){this.cb=cb}Quiet.prototype.observe=function(){};Quiet.prototype.disconnect=function(){};Quiet.prototype.takeRecords=function(){return[]};window.MutationObserver=function(cb){var src="";try{src=Function.prototype.toString.call(cb)}catch(_){};var noisy=(src.indexOf("addedNodes")!==-1&&(src.indexOf("schedule()")!==-1||src.indexOf("queueApply()")!==-1))||src.indexOf("requestAnimationFrame(apply)")!==-1;return noisy?new Quiet(cb):new Native(cb)};window.MutationObserver.prototype=Native.prototype;document.addEventListener("DOMContentLoaded",function(){setTimeout(function(){window.MutationObserver=Native},0)},{once:true});})();<\\/script>';
    const writeNeedle='document.open();document.write(html);document.close();';
    const writeFix=`if(html.includes('</body>'))html=html.replace('</body>','<script src="./taskflow-503020.js?v=1110-20260909"><\\/script><script src="./taskflow-503020-inputformat.js?v=1110-20260909"><\\/script><script src="./taskflow-firebase-v108.js?v=1120-20260909"><\\/script><script src="./taskflow-firestore-sync-v109.js?v=1110-20260909"><\\/script>${perfGuard}<script src="./taskflow-v117.js?v=1230-20260926"><\\/script><script src="./taskflow-v119.js?v=1230-20260926"><\\/script><script src="./taskflow-v1193-spacing.js?v=1193-20260921"><\\/script><script src="./taskflow-v120.js?v=1200-20260922"><\\/script><script src="./taskflow-v121-resetfix.js?v=1210-20260922"><\\/script><script src="./taskflow-v122-habit-visual.js?v=1230-20260926"><\\/script><script src="./taskflow-v1303-routine-guard.js?v=1303-20260930"><\\/script><script src="./taskflow-v125-routine-layout.js?v=1250-20260926"><\\/script><script src="./taskflow-v126-routine-tight.js?v=1264-20260926"><\\/script><script src="./taskflow-v127-ui-fixes.js?v=1280-20260930"><\\/script><script src="./taskflow-v1281-requested-layout.js?v=1281-20260930"><\\/script><script src="./taskflow-v129-rank-visual-system.js?v=1290-20260930"><\\/script><script src="./taskflow-v130-unified-layout.js?v=1300-20260930"><\\/script><script src="./taskflow-v1301-bottom-gap-fix.js?v=1301-20260930"><\\/script><script src="./taskflow-v1302-routine-spacing.js?v=1302-20260930"><\\/script><script src="./taskflow-v1303-routine-stability.js?v=1303-20260930"><\\/script><script src="./taskflow-v1303-routine-guard-restore.js?v=1303-20260930"><\\/script><script src="./taskflow-v1304-sound.js?v=13057-20261004"><\\/script><script src="./taskflow-v1305-search-results.js?v=1305-20261003"><\\/script></body>');document.open();document.write(html);document.close();`;
    if(!html.includes(headNeedle)||!html.includes(writeNeedle)||!html.includes(payloadCacheNeedle))throw new Error('La base publicada no coincide con la versión esperada.');
    html=html.replace(payloadCacheNeedle,payloadCacheFix).replace(headNeedle,headFix).replace(writeNeedle,writeFix);
    const remaining=Math.max(0,MIN_BOOT_MS-(performance.now()-started));
    if(remaining)await wait(remaining);
    msg.textContent='Iniciando TaskFlow…';
    document.open();document.write(html);document.close();
  }catch(ex){fail(ex);}
}
retry.addEventListener('click',start);
start();
})();
</script>
</body>
</html>
