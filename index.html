<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TaskFlow</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050914;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{min-height:100dvh;display:grid;place-items:center;padding:24px;overflow:hidden;background:
radial-gradient(circle at 50% 28%,rgba(66,225,209,.10),transparent 34%),
linear-gradient(180deg,#050914 0%,#07101e 58%,#050914 100%)}
.card{width:min(440px,100%);text-align:center}
.logo{font-size:44px;line-height:1;font-weight:950;letter-spacing:-.04em;background:linear-gradient(90deg,#42e1d1,#67e5d6,#ff9a43);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 34px rgba(66,225,209,.10)}
.sub{margin-top:10px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#8291aa;font-weight:850}
.msg{margin-top:20px;color:#aab5c8;font-size:13px}
.bar{height:5px;border-radius:999px;background:#10192b;overflow:hidden;margin:22px auto 0;max-width:310px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#40dfd0,#62e4b0,#ff9a43);animation:tfBoot5 5s linear forwards;border-radius:999px}
@keyframes tfBoot5{from{width:0}to{width:100%}}
.nv-watermark{margin:30px auto 0;display:grid;justify-items:center;gap:8px;opacity:.44;max-width:280px}
.nv-watermark img{display:block;width:min(220px,68vw);height:auto;border-radius:10px;filter:saturate(.82) brightness(.86);opacity:.48}
.nv-watermark span{font-size:9px;letter-spacing:.08em;color:#8290a8;text-transform:uppercase;font-weight:750}
.err{margin-top:14px;color:#ff8b9a;font-size:11px;display:none;line-height:1.45}
.retry{display:none;margin:16px auto 0;border:1px solid rgba(75,226,212,.3);border-radius:12px;padding:10px 16px;background:#12323a;color:#55e1d3;font-weight:800}
</style>
</head>
<body>
<div class="boot">
  <div class="card">
    <div class="logo">TaskFlow</div>
    <div class="sub">Organiza · Avanza · Cumple</div>
    <div class="msg" id="m">Preparando tu sistema…</div>
    <div class="bar" id="b"><i></i></div>
    <div class="nv-watermark" aria-label="Creado y actualizado por NovaVision GT">
      <img src="./novavision-watermark.svg" alt="NovaVision GT">
      <span>Creado y actualizado por NovaVision GT</span>
    </div>
    <div class="err" id="e"></div>
    <button class="retry" id="r" type="button">Reintentar</button>
  </div>
</div>
<script>
(()=>{
'use strict';
const msg=document.getElementById('m'),err=document.getElementById('e'),bar=document.getElementById('b'),retry=document.getElementById('r');
const MIN_BOOT_MS=5000;
let timer=null;
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function resetBar(){
  const i=bar&&bar.querySelector('i');
  if(!i)return;
  i.style.animation='none';
  void i.offsetWidth;
  i.style.animation='tfBoot5 5s linear forwards';
}
function fail(ex){
  if(timer){clearTimeout(timer);timer=null;}
  console.error('TaskFlow boot:',ex);
  bar.style.display='none';
  msg.textContent='No se pudo iniciar TaskFlow.';
  err.textContent=ex&&ex.name==='AbortError'?'La carga tardó demasiado. Toca Reintentar.':String(ex&&ex.message?ex.message:ex);
  err.style.display='block';
  retry.style.display='inline-flex';
}
async function start(){
  const started=performance.now();
  err.style.display='none';retry.style.display='none';bar.style.display='block';msg.textContent='Cargando TaskFlow…';resetBar();
  const ctrl=new AbortController();
  timer=setTimeout(()=>ctrl.abort(),15000);

    const res=await fetch('./taskflow-loader-v102.html?v=1280-20260930',{cache:'default',signal:ctrl.signal});
    if(!res.ok)throw new Error('No se pudo cargar la base de TaskFlow ('+res.status+')');
    let html=await res.text();
    if(timer){clearTimeout(timer);timer=null;}
    const headNeedle="if(html.includes('</head>'))html=html.replace('</head>',injectedStyle+cleanupScript+scrollBridgeScript+iconPortalGuard+'</head>');";

    const payloadCacheNeedle="fetch(base+name,{cache:'no-store',mode:'cors'})";
    const payloadCacheFix="fetch(base+name,{cache:'force-cache',mode:'cors'})";

    const routineGuard='<script id="tf-v1303-routine-listener-guard">(function(){if(window.__tfRoutineListenerGuardV1303)return;window.__tfRoutineListenerGuardV1303=true;window.__tfRoutineStabilityV1303=true;var dAdd=document.addEventListener.bind(document),wAdd=window.addEventListener.bind(window);var legacy={"taskflow-v125-routine-layout.js":1,"taskflow-v126-routine-tight.js":1,"taskflow-v127-ui-fixes.js":1,"taskflow-v1281-requested-layout.js":1,"taskflow-v129-rank-visual-system.js":1,"taskflow-v130-unified-layout.js":1,"taskflow-v1301-bottom-gap-fix.js":1,"taskflow-v1302-routine-spacing.js":1};function src(){try{return((document.currentScript&&document.currentScript.src)||"").split("/").pop().split("?")[0]}catch(_){return""}}function openRoutine(){var c=document.getElementById("windowContainer"),x=document.getElementById("windowContent");return!!(c&&c.classList.contains("open")&&x&&x.querySelector(".v96-mentalist-scroll,.v97-routine-scroll"))}function routineEvent(e){if(openRoutine())return true;var t=e&&e.target&&e.target.closest?e.target.closest(".v83-core-card.sung,.v83-core-card.legal,.v69-routine-launch,.v94-mentalist-launch"):null;return!!t}function wrap(type,fn){if(typeof fn!=="function")return fn;return function(e){if(type==="click"&&routineEvent(e))return;if((type==="resize"||type==="orientationchange")&&openRoutine())return;return fn.call(this,e)}}document.addEventListener=function(type,fn,opt){var name=src();return dAdd(type,legacy[name]&&type==="click"?wrap(type,fn):fn,opt)};window.addEventListener=function(type,fn,opt){var name=src();return wAdd(type,legacy[name]&&(type==="resize"||type==="orientationchange")?wrap(type,fn):fn,opt)};window.__tfRestoreLegacyVisualListenerRegistration=function(){document.addEventListener=dAdd;window.addEventListener=wAdd}})();<\/script>';
    const routineGuardRestore='<script>(function(){if(window.__tfRestoreLegacyVisualListenerRegistration)window.__tfRestoreLegacyVisualListenerRegistration()})();<\/script>';
    const writeNeedle='document.open();document.write(html);document.close();';
    const writeFix=`if(html.includes('</body>'))html=html.replace('</body>','<script src="./taskflow-503020.js?v=1110-20260909"><\/script><script src="./taskflow-503020-inputformat.js?v=1110-20260909"><\/script><script src="./taskflow-firebase-v108.js?v=1120-20260909"><\/script><script src="./taskflow-firestore-sync-v109.js?v=1110-20260909"><\/script>${perfGuard}<script src="./taskflow-v117.js?v=1230-20260926"><\/script><script src="./taskflow-v119.js?v=1230-20260926"><\/script><script src="./taskflow-v1193-spacing.js?v=1193-20260921"><\/script><script src="./taskflow-v120.js?v=1200-20260922"><\/script><script src="./taskflow-v121-resetfix.js?v=1210-20260922"><\/script><script src="./taskflow-v122-habit-visual.js?v=1230-20260926"><\/script>${routineGuard}<script src="./taskflow-v125-routine-layout.js?v=1250-20260926"><\/script><script src="./taskflow-v126-routine-tight.js?v=1264-20260926"><\/script><script src="./taskflow-v127-ui-fixes.js?v=1280-20260930"><\/script><script src="./taskflow-v1281-requested-layout.js?v=1281-20260930"><\/script><script src="./taskflow-v129-rank-visual-system.js?v=1290-20260930"><\/script><script src="./taskflow-v130-unified-layout.js?v=1300-20260930"><\/script><script src="./taskflow-v1301-bottom-gap-fix.js?v=1301-20260930"><\/script><script src="./taskflow-v1303-routine-stability.js?v=1303-20260930"><\/script>${routineGuardRestore}</body>');document.open();document.write(html);document.close();`;
    if(!html.includes(headNeedle)||!html.includes(writeNeedle)||!html.includes(payloadCacheNeedle))throw new Error('La base publicada no coincide con la versión esperada.');
    html=html.replace('V102 · iconos y desplazamiento estable','V130.3 · Rutinas estables y centradas').replace(payloadCacheNeedle,payloadCacheFix).replace(headNeedle,headFix).replace(writeNeedle,writeFix);
    const remaining=Math.max(0,MIN_BOOT_MS-(performance.now()-started));
    if(remaining)await wait(remaining);
    msg.textContent='Iniciando TaskFlow…';
    document.open();document.write(html);document.close();
  }catch(ex){fail(ex);}
}
retry.addEventListener('click',start);
start();
})();
</script>
</body>
</html>
